{# M7: one vaccine's fields. ``v`` is the vaccine being edited (none: a new one); ``bound``: this form was posted, so it shows what was typed; ``suffix`` keeps the ids apart. #}
<div class="op-form-grid">
<div class="op-field"><label for="vx-ar-{{ suffix }}">{{ vx.name_ar }}</label><input id="vx-ar-{{ suffix }}" name="name_ar" maxlength="120" required value="{% if bound %}{{ post.name_ar }}{% else %}{{ v.name_ar|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="vx-en-{{ suffix }}">{{ vx.name_en }}</label><input id="vx-en-{{ suffix }}" name="name_en" maxlength="120" dir="ltr" value="{% if bound %}{{ post.name_en }}{% else %}{{ v.name_en|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="vx-sp-{{ suffix }}">{{ vx.species }}</label><select id="vx-sp-{{ suffix }}" name="species"><option value="">{{ vx.any_species }}</option>{% for value, label in species %}<option value="{{ value }}"{% if bound and post.species == value or not bound and v.species == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="vx-iv-{{ suffix }}">{{ vx.interval }}</label><input id="vx-iv-{{ suffix }}" name="interval_days" inputmode="numeric" dir="ltr" maxlength="4" value="{% if bound %}{{ post.interval_days }}{% else %}{{ v.interval_days|default_if_none:'' }}{% endif %}"><small>{{ vx.interval_hint }}</small></div>
<div class="op-field vx-wide"><label for="vx-it-{{ suffix }}">{{ vx.item }}</label><select id="vx-it-{{ suffix }}" name="item"><option value="">{{ vx.item_none }}</option>{% for item in items %}<option value="{{ item.pk }}"{% if bound and post.item == item.pk|stringformat:"d" or not bound and v.item_id == item.pk %} selected{% endif %}>{{ item.item_name }}</option>{% endfor %}</select><small>{{ vx.item_hint }}</small></div>
{% if v %}<label class="op-check"><input type="hidden" name="active" value="0"><input type="checkbox" name="active" value="1"{% if bound %}{% if post.active == '1' %} checked{% endif %}{% elif v.active %} checked{% endif %}> {{ vx.active }}</label>{% endif %}
</div>
