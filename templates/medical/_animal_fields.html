<form class="op-form" method="post" data-animal-form>{% csrf_token %}<input type="hidden" name="lang" value="{{ lang }}">
<div class="op-form-grid">
<div class="op-field"><label for="an-name">{{ vw.name }}</label><input id="an-name" name="name" required maxlength="80" value="{% if post %}{{ post.name }}{% else %}{{ animal.name|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="an-species">{{ vw.species }}</label><select id="an-species" name="species" required><option value="">{{ vw.choose }}</option>{% for value, label in species %}<option value="{{ value }}"{% if post.species == value or not post and animal.species == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="an-breed">{{ vw.breed }}</label><input id="an-breed" name="breed" maxlength="80" value="{% if post %}{{ post.breed }}{% else %}{{ animal.breed|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="an-sex">{{ vw.sex }}</label><select id="an-sex" name="sex"><option value="">—</option><option value="male"{% if post.sex == 'male' or not post and animal.sex == 'male' %} selected{% endif %}>{{ vw.male }}</option><option value="female"{% if post.sex == 'female' or not post and animal.sex == 'female' %} selected{% endif %}>{{ vw.female }}</option></select></div>
<div class="op-field"><label for="an-dob">{{ vw.dob }}</label><input id="an-dob" type="date" name="date_of_birth" max="{{ today|date:'Y-m-d' }}" value="{% if post %}{{ post.date_of_birth }}{% else %}{{ animal.date_of_birth|date:'Y-m-d' }}{% endif %}"></div>
<div class="op-field"><label for="an-colour">{{ vw.colour }}</label><input id="an-colour" name="colour" maxlength="60" value="{% if post %}{{ post.colour }}{% else %}{{ animal.colour|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="an-chip">{{ vw.microchip }}</label><input id="an-chip" name="microchip" maxlength="40" dir="ltr" value="{% if post %}{{ post.microchip }}{% else %}{{ animal.microchip|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="an-allergies">{{ vw.allergies }}</label><textarea id="an-allergies" name="allergies">{% if post %}{{ post.allergies }}{% else %}{{ animal.allergies|default:'' }}{% endif %}</textarea></div>
<div class="op-field"><label for="an-notes">{{ vw.notes }}</label><textarea id="an-notes" name="notes">{% if post %}{{ post.notes }}{% else %}{{ animal.notes|default:'' }}{% endif %}</textarea></div>
<label class="op-check"><input type="checkbox" name="neutered" value="1"{% if post.neutered == '1' or not post and animal.neutered %} checked{% endif %}> {{ vw.neutered }}</label>
<label class="op-check"><input type="hidden" name="active" value="0"><input type="checkbox" name="active" value="1"{% if post %}{% if post.active == '1' %} checked{% endif %}{% elif not animal or animal.active %} checked{% endif %}> {{ vw.active }}</label>
</div><div class="op-form-actions"><button class="op-primary" type="submit">{{ vw.save }}</button></div></form>
