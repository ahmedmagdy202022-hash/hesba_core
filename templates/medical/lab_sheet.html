{% load static hesba_format %}<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ lw.sheet }} — {{ patient.name }}</title>
<link rel="stylesheet" href="{% static 'hesba/css/tokens.css' %}"><link rel="stylesheet" href="{% static 'hesba/css/print.css' %}?v=print-004">
<style>.lab{max-width:760px;margin:24px auto;padding:28px;background:var(--hs-surface);border:1px solid var(--hs-line);border-radius:14px;font-family:var(--hs-font-body);color:var(--hs-ink)}.lab header{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--hs-teal);padding-bottom:12px}.lab h1{margin:0;font-family:var(--hs-font-head);color:var(--hs-navy);font-size:22px}.lab h2{color:var(--hs-navy);font-size:18px;margin:16px 0 8px}.lab .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:12px 0}.lab table{width:100%;border-collapse:collapse}.lab th,.lab td{padding:8px 10px;border-bottom:1px solid var(--hs-line);text-align:start}.lab th{color:var(--hs-muted);font-size:13px}.lab .out{font-weight:700;color:var(--hs-danger-solid)}/* video finding 15: on a phone the sample's date broke after «2026-» and a range «12 – 16» wrapped over three lines */.lab .meta b,.lab .meta bdi{white-space:nowrap}.lab td bdi,.lab td [dir=ltr]{white-space:nowrap}.lab footer{display:flex;justify-content:flex-end;margin-top:30px;padding-top:12px;border-top:1px solid var(--hs-line)}@media print{.no-print{display:none}.lab{border:0;margin:0}}</style></head>
<body style="background:var(--hs-ground)">
<p class="no-print" style="text-align:center"><button type="button" data-print style="min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--hs-teal);color:var(--hs-on-teal);font-weight:700">{{ lw.print }}</button></p>
<main class="lab" data-lab-sheet>
{% include "medical/_lab_sheet_body.html" %}
</main>
<script>document.querySelector('[data-print]').addEventListener('click', function(){ window.print(); });</script>
</body></html>
