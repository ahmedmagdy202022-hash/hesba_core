<div class="op-field"><label for="st-name">{{ words.name }}</label><input id="st-name" name="name" required maxlength="255" value="{% if post %}{{ post.name }}{% else %}{{ student.name }}{% endif %}"></div>
<div class="op-field"><label for="st-phone">{{ words.phone }}</label><input id="st-phone" name="phone" maxlength="50" inputmode="tel" dir="ltr" value="{% if post %}{{ post.phone }}{% else %}{{ student.phone }}{% endif %}"></div>
<div class="op-field"><label for="st-stage">{{ words.stage }}</label><input id="st-stage" name="stage" maxlength="80" value="{% if post %}{{ post.stage }}{% else %}{{ student.stage }}{% endif %}"></div>
<div class="op-field"><label for="st-school">{{ words.school }}</label><input id="st-school" name="school" maxlength="120" value="{% if post %}{{ post.school }}{% else %}{{ student.school }}{% endif %}"></div>
<div class="op-field"><label for="st-dob">{{ words.dob }}</label><input id="st-dob" type="date" name="date_of_birth" value="{% if post %}{{ post.date_of_birth }}{% else %}{{ student.date_of_birth|date:'Y-m-d' }}{% endif %}"></div>
<div class="op-field"><label for="st-relation">{{ words.relation }}</label><input id="st-relation" name="relation" maxlength="40" list="edu-relations" value="{% if post %}{{ post.relation }}{% else %}{{ student.relation }}{% endif %}">
<datalist id="edu-relations">{% if lang == 'en' %}<option value="Father"><option value="Mother"><option value="Self"><option value="Guardian">{% else %}<option value="الأب"><option value="الأم"><option value="نفسه"><option value="ولي الأمر">{% endif %}</datalist></div>
<div class="op-field"><label for="st-notes">{{ words.notes }}</label><textarea id="st-notes" name="notes" rows="2">{% if post %}{{ post.notes }}{% else %}{{ student.notes }}{% endif %}</textarea></div>
