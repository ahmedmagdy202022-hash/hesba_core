{% load l10n %}<div class="op-field"><label for="gr-course">{{ words.course }}</label><select id="gr-course" name="course" required><option value="">{{ words.choose }}</option>{% for c in courses %}<option value="{{ c.pk }}"{% if group and group.course_id == c.pk %} selected{% elif post.course == c.pk|stringformat:'s' or preset_course == c.pk|stringformat:'s' %} selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="gr-name">{{ words.name }}</label><input id="gr-name" name="name" required maxlength="160" value="{% if post %}{{ post.name }}{% else %}{{ group.name }}{% endif %}" placeholder="{% if lang == 'en' %}e.g. Grade 3 — Saturday group{% else %}مثلًا: تالتة إعدادي — مجموعة السبت{% endif %}"></div>
<div class="op-field"><label for="gr-teacher">{{ words.teacher }}</label><select id="gr-teacher" name="teacher"><option value="">{{ words.choose }}</option>{% for t in teachers %}<option value="{{ t.pk }}"{% if group and group.teacher_id == t.pk %} selected{% elif post.teacher == t.pk|stringformat:'s' %} selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="gr-room">{{ words.room }}</label><input id="gr-room" name="room" maxlength="60" value="{% if post %}{{ post.room }}{% else %}{{ group.room }}{% endif %}"></div>
<fieldset class="op-field edu-days"><legend>{{ words.days }}</legend>{% for value, label in weekdays %}<label class="op-check"><input type="checkbox" name="days" value="{{ value }}"{% if value in chosen_days %} checked{% endif %}> {{ label }}</label>{% endfor %}</fieldset>
<div class="op-field"><label for="gr-time">{{ words.start_time }}</label><input id="gr-time" type="time" name="start_time" value="{% if post %}{{ post.start_time }}{% else %}{{ group.start_time|time:'H:i' }}{% endif %}"></div>
<div class="op-field"><label for="gr-duration">{{ words.duration }}</label><input id="gr-duration" name="duration_minutes" inputmode="numeric" value="{% if post %}{{ post.duration_minutes }}{% else %}{{ group.duration_minutes|default:90 }}{% endif %}"></div>
<div class="op-field"><label for="gr-capacity">{{ words.capacity }}</label><input id="gr-capacity" name="capacity" inputmode="numeric" value="{% if post %}{{ post.capacity }}{% else %}{{ group.capacity|default:0 }}{% endif %}"></div>
<div class="op-field"><label for="gr-fee">{{ words.group_fee }}</label><input id="gr-fee" name="fee" inputmode="decimal" value="{% if post %}{{ post.fee }}{% elif group.fee is not None %}{{ group.fee|unlocalize }}{% endif %}"></div>
<div class="op-field"><label for="gr-starts">{{ words.starts_on }}</label><input id="gr-starts" type="date" name="starts_on" value="{% if post %}{{ post.starts_on }}{% else %}{{ group.starts_on|date:'Y-m-d' }}{% endif %}"></div>
<div class="op-field"><label for="gr-ends">{{ words.ends_on }}</label><input id="gr-ends" type="date" name="ends_on" value="{% if post %}{{ post.ends_on }}{% else %}{{ group.ends_on|date:'Y-m-d' }}{% endif %}"></div>
