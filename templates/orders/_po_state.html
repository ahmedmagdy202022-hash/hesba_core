<span class="op-status {% if state == 'confirmed' %}op-status-open{% elif state == 'done' or state == 'closed' %}op-status-posted{% elif state == 'cancelled' or state == 'late' %}op-status-cancelled{% else %}op-status-draft{% endif %}" data-state="{{ state }}">{% for key, label in labels.items %}{% if key == state %}{{ label }}{% endif %}{% endfor %}</span>
