<div class="op-form-grid">
<div class="op-field"><label for="sc-customer">{{ words.customer }}</label><select id="sc-customer" name="customer" required><option value="">{{ words.choose }}</option>{% for c in customers %}<option value="{{ c.pk }}"{% if post.customer == c.pk|stringformat:'s' or not post and contract.customer_id == c.pk %} selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="sc-service">{{ words.service }}</label><select id="sc-service" name="service" required><option value="">{{ words.choose }}</option>{% for s in services_list %}<option value="{{ s.pk }}"{% if post.service == s.pk|stringformat:'s' or not post and contract.service_id == s.pk %} selected{% endif %}>{{ s.item_name }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="sc-desc">{{ words.description }}</label><input id="sc-desc" name="description" maxlength="255" value="{% if post %}{{ post.description }}{% else %}{{ contract.description|default:'' }}{% endif %}"></div>
<div class="op-field"><label for="sc-amount">{{ words.amount }}</label><input id="sc-amount" name="amount" inputmode="decimal" required value="{% if post %}{{ post.amount }}{% elif contract %}{{ contract.amount|stringformat:'.2f' }}{% endif %}"></div>
<div class="op-field"><label for="sc-every">{{ words.every }}</label><select id="sc-every" name="every">{% for value, label in everies %}<option value="{{ value }}"{% if post.every == value or not post and contract.every == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="sc-visits">{{ words.visits }}</label><input id="sc-visits" name="visits_per_period" inputmode="numeric" value="{% if post %}{{ post.visits_per_period }}{% else %}{{ contract.visits_per_period|default:'0' }}{% endif %}"></div>
<div class="op-field"><label for="sc-starts">{{ words.starts }}</label><input id="sc-starts" type="date" name="starts_on" required value="{% if post %}{{ post.starts_on }}{% elif contract %}{{ contract.starts_on|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}"></div>
<div class="op-field"><label for="sc-ends">{{ words.ends }}</label><input id="sc-ends" type="date" name="ends_on" value="{% if post %}{{ post.ends_on }}{% else %}{{ contract.ends_on|date:'Y-m-d' }}{% endif %}"></div>
{% if contract %}<div class="op-field"><label for="sc-status">{{ words.status }}</label><select id="sc-status" name="status">{% for value, label in statuses %}<option value="{{ value }}"{% if post.status == value or not post and contract.status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
<div class="op-field"><label for="sc-notes">{{ words.notes }}</label><input id="sc-notes" name="notes" maxlength="255" value="{% if post %}{{ post.notes }}{% else %}{{ contract.notes|default:'' }}{% endif %}"></div>
</div>
