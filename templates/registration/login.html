<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول حسبة</title>
<style>
:root{--navy:#05243f;--teal:#0aa3a8;--gold:#d9ad50;--ink:#13243a;--muted:#667085}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff,#f7f1e6);display:grid;place-items:center;padding:14px}.login-screen{position:relative;direction:ltr;width:min(1100px,100%);min-height:min(680px,calc(100svh - 28px));overflow:hidden;border-radius:36px;box-shadow:0 28px 80px rgba(5,36,63,.16);border:1px solid rgba(255,255,255,.9);background:#fff url('/static/hesba/brand/login_tablet.png') center center/cover no-repeat;display:flex;align-items:center;justify-content:flex-start;padding:52px}.login-card{direction:rtl;width:min(410px,100%);border-radius:30px;padding:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.48);box-shadow:0 18px 45px rgba(5,36,63,.08),inset 0 1px 0 rgba(255,255,255,.52)}h1{margin:0;color:var(--navy);font-size:42px;line-height:1.1;text-shadow:0 1px 0 rgba(255,255,255,.95)}.hint{margin:9px 0 20px;color:#4f5d6d;font-size:14px;text-shadow:0 1px 0 rgba(255,255,255,.90)}.field{margin-top:14px}label{display:block;margin:0 0 7px;color:var(--navy);font-weight:900;font-size:14px;text-shadow:0 1px 0 rgba(255,255,255,.95)}input{width:100%;height:52px;border-radius:17px;border:1px solid rgba(5,36,63,.15);padding:10px 14px;font:inherit;background:rgba(255,255,255,.70);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,163,168,.13);background:rgba(255,255,255,.82)}button{width:100%;height:54px;border:0;border-radius:18px;margin-top:18px;background:linear-gradient(135deg,#d7a947,#f5dc91);color:#172033;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(217,173,80,.25)}.error{margin:0 0 14px;padding:12px;border-radius:16px;background:rgba(255,241,241,.85);color:#9f1239;border:1px solid #fecdd3}.footer{display:none}@media(max-width:820px){body{padding:8px;place-items:start center}.login-screen{width:100%;min-height:calc(100svh - 16px);border-radius:30px;background-image:url('/static/hesba/brand/login_mobile.png');background-position:center center;background-size:cover;padding:14px 14px 20px;align-items:center;justify-content:center}.login-card{width:100%;margin-top:150px;padding:16px;border-radius:24px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.40);box-shadow:0 12px 34px rgba(5,36,63,.06),inset 0 1px 0 rgba(255,255,255,.46)}h1{font-size:31px}.hint{font-size:12.5px;margin:7px 0 10px;color:#4f5d6d}.field{margin-top:8px}label{font-size:13px;margin-bottom:6px}input{height:46px;border-radius:16px;background:rgba(255,255,255,.74)}button{height:50px;margin-top:12px;border-radius:17px}}@media(max-width:390px){.login-screen{padding:12px 12px 16px}.login-card{margin-top:132px;padding:14px}h1{font-size:29px}.hint{font-size:12px}input{height:44px}button{height:48px}}
</style>
</head>
<body>
<main class="login-screen">
<section class="login-card"><h1>تسجيل الدخول</h1><p class="hint">استخدم حسابك للدخول حسب الدور والصلاحيات.</p>{% if form.errors %}<div class="error">بيانات الدخول غير صحيحة. راجع اسم المستخدم وكلمة المرور.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label for="id_username">اسم المستخدم</label>{{ form.username }}</div><div class="field"><label for="id_password">كلمة المرور</label>{{ form.password }}</div><button type="submit">الدخول إلى حسبة</button></form><div class="footer">Developed by Ahmed Magdy</div></section>
</main>
</body>
</html>
