<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول حسبة</title>
<style>
:root{--navy:#05243f;--teal:#0aa3a8;--gold:#d9ad50;--ink:#13243a;--muted:#667085;--line:rgba(5,36,63,.12);--card:#fbfaf7}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(10,163,168,.13),transparent 30%),linear-gradient(180deg,#fff,#f7f1e6);display:grid;place-items:center;padding:14px}.screen{width:min(1060px,100%);min-height:min(650px,calc(100svh - 28px));overflow:hidden;border-radius:34px;background:linear-gradient(145deg,#ffffff,#f9fefe);box-shadow:0 28px 80px rgba(5,36,63,.15);border:1px solid rgba(255,255,255,.9);display:grid;grid-template-columns:1fr 420px;position:relative}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 4% 95%,rgba(223,248,247,.9),transparent 22%),radial-gradient(circle at 97% 5%,rgba(223,248,247,.85),transparent 18%);pointer-events:none}.brand,.form-wrap{position:relative;z-index:1}.brand{display:grid;place-items:center;padding:26px}.brand-banner{width:min(94%,560px);height:315px;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 18px 48px rgba(5,36,63,.08);border:1px solid rgba(5,36,63,.06);display:grid;place-items:center}.brand-img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 32%}.form-wrap{display:grid;place-items:center;padding:28px}.form-card{width:100%;border-radius:30px;padding:28px;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(252,251,248,.90));backdrop-filter:blur(14px);border:1px solid rgba(5,36,63,.10);box-shadow:0 18px 45px rgba(5,36,63,.10),inset 0 1px 0 rgba(255,255,255,.9)}h1{margin:0;color:var(--navy);font-size:42px;line-height:1.1}.hint{margin:9px 0 20px;color:var(--muted);font-size:14px}.field{margin-top:14px}label{display:block;margin:0 0 7px;color:var(--navy);font-weight:900;font-size:14px}input{width:100%;height:52px;border-radius:17px;border:1px solid var(--line);padding:10px 14px;font:inherit;background:#fbfdff;color:var(--ink)}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,163,168,.12)}button{width:100%;height:54px;border:0;border-radius:18px;margin-top:18px;background:linear-gradient(135deg,#d7a947,#f5dc91);color:#172033;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(217,173,80,.23)}.error{margin:0 0 14px;padding:12px;border-radius:16px;background:#fff1f1;color:#9f1239;border:1px solid #fecdd3}.footer{margin-top:18px;text-align:center;color:#667085;font-size:13px;font-weight:700;letter-spacing:.2px}@media(max-width:820px){body{padding:8px;place-items:start center}.screen{display:block;min-height:calc(100svh - 16px);border-radius:30px}.brand{padding:12px 16px 0}.brand-banner{width:min(100%,460px);height:165px;border-radius:24px}.brand-img{object-fit:cover;object-position:center 30%}.form-wrap{display:block;padding:12px 20px 22px;position:relative;z-index:2}.form-card{padding:16px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(252,251,248,.92));box-shadow:0 12px 34px rgba(5,36,63,.08)}h1{font-size:31px}.hint{font-size:12.5px;margin:7px 0 10px}.field{margin-top:8px}label{font-size:13px;margin-bottom:6px}input{height:46px;border-radius:16px}button{height:50px;margin-top:12px;border-radius:17px}.footer{font-size:12.5px;margin-top:13px;color:#667085}}@media(max-width:390px){.brand{padding-top:10px}.brand-banner{height:145px;border-radius:22px}.form-wrap{padding-inline:12px;padding-top:10px}.form-card{padding:14px}h1{font-size:29px}.hint{font-size:12px}input{height:44px}button{height:48px}}
</style>
</head>
<body>
<main class="screen">
<section class="brand" aria-label="حسبة"><div class="brand-banner"><img class="brand-img" src="/static/hesba/brand/hesba_launch.svg" alt="حسبة - Hesba - إدارة أسهل... قرارات أوضح"></div></section>
<section class="form-wrap"><div class="form-card"><h1>تسجيل الدخول</h1><p class="hint">استخدم حسابك للدخول حسب الدور والصلاحيات.</p>{% if form.errors %}<div class="error">بيانات الدخول غير صحيحة. راجع اسم المستخدم وكلمة المرور.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label for="id_username">اسم المستخدم</label>{{ form.username }}</div><div class="field"><label for="id_password">كلمة المرور</label>{{ form.password }}</div><button type="submit">الدخول إلى حسبة</button></form><div class="footer">Developed by Ahmed Magdy</div></div></section>
</main>
</body>
</html>
