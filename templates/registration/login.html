<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول حِسْبَة</title>
<style>
:root{--navy:#05243f;--teal:#0aa3a8;--gold:#d9ad50;--ink:#13243a;--muted:#667085;--line:rgba(5,36,63,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(10,163,168,.14),transparent 30%),linear-gradient(180deg,#fff,#f7f1e6);display:grid;place-items:center;padding:14px}.screen{position:relative;width:min(1040px,100%);min-height:min(650px,calc(100svh - 28px));overflow:hidden;border-radius:34px;background:rgba(255,255,255,.96);box-shadow:0 28px 80px rgba(5,36,63,.16);border:1px solid rgba(255,255,255,.9);display:grid;grid-template-columns:1fr 420px;isolation:isolate}.screen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 18%,rgba(20,199,200,.11),transparent 26%),radial-gradient(circle at 96% 5%,rgba(223,248,247,.9),transparent 18%),radial-gradient(circle at 3% 96%,rgba(223,248,247,.85),transparent 20%);z-index:-1}.brand{display:grid;place-items:center;padding:22px;min-width:0}.brand-img{display:block;width:min(92%,520px);max-height:620px;object-fit:contain;border-radius:22px}.form-wrap{display:grid;place-items:center;padding:28px;min-width:0}.form-card{width:100%;border-radius:28px;padding:28px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border:1px solid rgba(5,36,63,.09);box-shadow:0 18px 45px rgba(5,36,63,.10)}h1{margin:0;color:var(--navy);font-size:42px;line-height:1.1}.hint{margin:9px 0 20px;color:var(--muted);font-size:14px}.field{margin-top:14px}label{display:block;margin:0 0 7px;color:var(--navy);font-weight:900;font-size:14px}input{width:100%;height:52px;border-radius:17px;border:1px solid var(--line);padding:10px 14px;font:inherit;background:#fbfdff;color:var(--ink)}input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,163,168,.12)}button{width:100%;height:54px;border:0;border-radius:18px;margin-top:18px;background:linear-gradient(135deg,#d7a947,#f5dc91);color:#172033;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(217,173,80,.23)}.safe{margin-top:15px;border-radius:18px;padding:12px 13px;background:#f3fbfb;border:1px solid rgba(10,163,168,.14);color:var(--muted);font-size:13px;line-height:1.65}.error{margin:0 0 14px;padding:12px;border-radius:16px;background:#fff1f1;color:#9f1239;border:1px solid #fecdd3}.footer{margin-top:14px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:820px){body{padding:8px;place-items:start center}.screen{display:block;min-height:calc(100svh - 16px);border-radius:30px}.brand{padding:14px 16px 0;min-height:315px;align-items:start}.brand-img{width:min(82%,330px);max-height:330px}.form-wrap{display:block;padding:0 20px 22px;margin-top:-28px;position:relative;z-index:2}.form-card{padding:18px;border-radius:24px;background:rgba(255,255,255,.88);box-shadow:0 12px 34px rgba(5,36,63,.08)}h1{font-size:34px}.hint{font-size:13px;margin-bottom:12px}.field{margin-top:10px}input{height:50px}button{height:54px;margin-top:14px}.safe{font-size:12px;padding:10px}.footer{font-size:12px;margin-top:10px}}@media(max-width:390px){.brand{min-height:285px}.brand-img{width:min(84%,290px);max-height:290px}.form-wrap{padding-inline:14px;margin-top:-18px}.form-card{padding:16px}h1{font-size:31px}}
</style>
</head>
<body>
<main class="screen">
<section class="brand" aria-label="حِسْبَة"><img class="brand-img" src="/static/hesba/brand/hesba_launch.svg" alt="حِسْبَة - Hesba - إدارة أسهل... قرارات أوضح"></section>
<section class="form-wrap"><div class="form-card"><h1>تسجيل الدخول</h1><p class="hint">استخدم حسابك للدخول حسب الدور والصلاحيات.</p>{% if form.errors %}<div class="error">بيانات الدخول غير صحيحة. راجع اسم المستخدم وكلمة المرور.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label for="id_username">اسم المستخدم</label>{{ form.username }}</div><div class="field"><label for="id_password">كلمة المرور</label>{{ form.password }}</div><button type="submit">دخول إلى حِسْبَة</button></form><div class="safe">لا يتم عرض Dashboard أو تقارير أو تكلفة أو ربح قبل تسجيل الدخول.</div><div class="footer">Developed by Ahmed Magdy</div></div></section>
</main>
</body>
</html>
