{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - حسبة</title>
<link rel="stylesheet" href="{% static 'hesba/css/login.css' %}">
</head>
<body class="login-page">
<main class="login-stage">
<div class="login-bg" aria-hidden="true"></div>
<section class="login-form-layer">
<div class="login-form-wrap">
<h1>تسجيل الدخول</h1>
<p class="login-subtitle">استخدم حسابك للدخول حسب الدور والصلاحيات.</p>
{% if form.errors %}<div class="error">بيانات الدخول غير صحيحة. راجع اسم المستخدم وكلمة المرور.</div>{% endif %}
<form method="post" class="login-form">
{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
<div class="field"><label for="id_username">اسم المستخدم</label>{{ form.username }}</div>
<div class="field"><label for="id_password">كلمة المرور</label>{{ form.password }}</div>
<button type="submit" class="login-btn">الدخول إلى حسبة</button>
</form>
</div>
</section>
</main>
</body>
</html>
