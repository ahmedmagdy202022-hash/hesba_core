{% load hesba_labels %}{# UX Wave 2: a save's toast (settings_core/saved_toast.py): what was saved, then the next step as buttons from the view's saved_actions. #}<div class="hs-toast" role="status" data-saved-toast><span>✓ {{ message|ui:lang }}</span>{% if saved_actions %}<span class="hs-toast__actions">{% for action in saved_actions %}<a class="op-secondary" href="{{ action.url }}"{% if action.blank %} target="_blank" rel="noopener"{% endif %} data-saved-action>{{ action.label }}</a>{% endfor %}</span>{% endif %}</div>
