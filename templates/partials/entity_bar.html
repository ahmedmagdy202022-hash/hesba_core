{% load hesba_entities %}{% entity_bar as bar %}{% if bar %}<nav class="hs-entities" aria-label="{{ bar.label }}" data-entity-bar><span class="hs-entities__label">{{ bar.label }}</span>{% for tab in bar.tabs %}<form method="post" action="{% url 'entities:switch' %}">{% csrf_token %}<input type="hidden" name="entity" value="{{ tab.pk }}"><input type="hidden" name="next" value="{{ bar.next }}"><button type="submit" class="hs-entities__tab{% if tab.current %} is-current{% endif %}"{% if tab.current %} aria-current="true"{% endif %} data-entity-tab="{{ tab.pk }}">{{ tab.label }}</button></form>{% endfor %}</nav>{% endif %}
