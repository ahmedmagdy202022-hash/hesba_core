<form class="op-filters" method="get"><input type="hidden" name="lang" value="{{ lang }}"><label class="op-inline-label">{{ words.from }}<input type="date" name="from" value="{{ date_from|date:'Y-m-d' }}"></label><label class="op-inline-label">{{ words.to }}<input type="date" name="to" value="{{ date_to|date:'Y-m-d' }}"></label>{% if entities|length > 1 %}<label class="op-inline-label">{{ words.entity }}<select name="entity"><option value="">{{ words.all_entities }}</option>{% for e in entities %}<option value="{{ e.pk }}"{% if entity and entity.pk == e.pk %} selected{% endif %}>{% if lang == 'en' and e.name_en %}{{ e.name_en }}{% else %}{{ e.name_ar }}{% endif %}</option>{% endfor %}</select></label>{% endif %}<button type="submit">{{ words.show }}</button></form>
