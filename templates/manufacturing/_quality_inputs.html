{# Manufacturing F5 (HG-136): the criteria a check asks: pass or fail, or a measured number with its limits in words. #}
{% if criteria_inputs %}<div class="op-form-grid" data-quality-criteria>{% for row in criteria_inputs %}<div class="op-field" data-criterion="{{ row.criterion.pk }}"><label for="qc-c{{ row.criterion.pk }}">{{ row.name }}{% if row.limits %} <small class="op-muted">({{ row.limits }})</small>{% endif %}</label>{% if row.number %}<input id="qc-c{{ row.criterion.pk }}" name="{{ row.field }}" value="{{ row.value }}" inputmode="decimal" dir="ltr" placeholder="{{ qw.reading }}">{% else %}<select id="qc-c{{ row.criterion.pk }}" name="{{ row.field }}"><option value="">{{ qw.choose }}</option><option value="pass"{% if row.value == 'pass' %} selected{% endif %}>{{ qw.ok }}</option><option value="fail"{% if row.value == 'fail' %} selected{% endif %}>{{ qw.not_ok }}</option></select>{% endif %}</div>{% endfor %}</div>{% endif %}
