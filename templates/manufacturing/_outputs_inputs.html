{# Manufacturing F9 (HG-139): what really came out of each by-product and co-product, on a run form (a plain run, or an order's finish). Quantities only. #}
{% if output_inputs %}<h3 data-output-inputs>{{ bw.actual_title }}</h3><p class="op-muted">{{ bw.actual_hint }}</p><div class="op-form-grid">{% for row in output_inputs %}<div class="op-field"><label for="oq-{{ row.output.pk }}">{{ row.output.item.item_name }} <small class="op-muted">{{ row.kind }}</small></label><input id="oq-{{ row.output.pk }}" name="output_qty_{{ row.output.pk }}" value="{{ row.value }}" inputmode="decimal" dir="ltr" data-output-qty="{{ row.output.item.item_code }}"></div>{% endfor %}</div>{% endif %}
