<div class="op-form-grid">
<div class="op-field"><label for="rc-product">{{ words.product }}</label><select id="rc-product" name="product" required><option value="">—</option>{% for item in items %}<option value="{{ item.pk }}"{% if form.product == item.pk|stringformat:"s" %} selected{% endif %}>{{ item.item_code }} · {{ item.item_name }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="rc-output">{{ words.output }}</label><input id="rc-output" name="output_quantity" value="{{ form.output_quantity|default:'1'|stringformat:'s' }}" inputmode="decimal" dir="ltr"></div>
<div class="op-field"><label for="rc-name">{{ words.name }}</label><input id="rc-name" name="name" value="{{ form.name|default:'' }}" maxlength="255"></div>
<div class="op-field"><label for="rc-notes">{{ words.notes }}</label><input id="rc-notes" name="notes" value="{{ form.notes|default:'' }}" maxlength="255"></div>
<label class="op-field"><span><input type="checkbox" name="active"{% if form.active %} checked{% endif %}> {{ words.active }}</span></label>
</div>
<h2>{{ words.components }}</h2><p class="op-muted">{{ words.stock_only }}</p>
<div data-recipe-lines>
{% for component, qty in rows %}<div class="op-form-grid" data-recipe-line{% if forloop.counter > 3 and not component %} hidden{% endif %}><div class="op-field"><label for="rc-c{{ forloop.counter0 }}">{{ words.component }} {{ forloop.counter }}</label><select id="rc-c{{ forloop.counter0 }}" name="component_{{ forloop.counter0 }}"><option value="">—</option>{% for item in items %}<option value="{{ item.pk }}"{% if component|stringformat:"s" == item.pk|stringformat:"s" %} selected{% endif %}>{{ item.item_code }} · {{ item.item_name }}</option>{% endfor %}</select></div>
<div class="op-field"><label for="rc-q{{ forloop.counter0 }}">{{ words.qty }}</label><input id="rc-q{{ forloop.counter0 }}" name="qty_{{ forloop.counter0 }}" value="{{ qty|stringformat:'s' }}" inputmode="decimal" dir="ltr"></div></div>{% endfor %}
</div>
<div class="op-form-actions"><button class="op-secondary" type="button" data-add-component>+ {% if lang == 'en' %}Add a component{% else %}مكوّن كمان{% endif %}</button></div>
<script>(function(){var b=document.querySelector('[data-add-component]');if(!b){return;}b.addEventListener('click',function(){var next=document.querySelector('[data-recipe-line][hidden]');if(next){next.hidden=false;var s=next.querySelector('select');if(s){s.focus();}}if(!document.querySelector('[data-recipe-line][hidden]')){b.hidden=true;}});})();</script>
