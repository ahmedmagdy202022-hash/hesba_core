{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hesba">
<link rel="manifest" href="{% static 'hesba/manifest.json' %}">
<link rel="preload" as="image" href="{% static 'hesba/brand/login_web.final.png' %}" media="(min-width: 1101px)">
<link rel="preload" as="image" href="{% static 'hesba/brand/login_tablet.png' %}" media="(min-width: 641px) and (max-width: 1100px)">
<link rel="preload" as="image" href="{% static 'hesba/brand/login_mobile.final.png' %}" media="(max-width: 640px)">
<title>حِسْبَة ERP - تسجيل الدخول</title>
<style>
:root{--navy:#05243f;--teal:#07939a;--gold:#d7aa4b;--cream:#fbf6ec;--ink:#142033;--muted:#667085;--line:rgba(5,36,63,.12);--shadow:0 22px 55px rgba(5,36,63,.14)}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.login-page{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background-color:var(--cream);background-image:url("{% static 'hesba/brand/login_web.final.png' %}");background-repeat:no-repeat;background-position:center;background-size:cover}.login-page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 0,rgba(7,147,154,.08),transparent 28%),linear-gradient(90deg,rgba(251,246,236,.16),transparent 42%,rgba(251,246,236,.04));}.language-field{position:absolute;z-index:3;top:max(22px,env(safe-area-inset-top));right:max(28px,env(safe-area-inset-right));min-height:44px;display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 16px 36px rgba(5,36,63,.12);backdrop-filter:blur(12px)}.language-field label{color:var(--navy);font-size:12px;font-weight:900}.language-field select{min-width:108px;border:0;outline:0;background:transparent;color:var(--navy);font-weight:900}.login-card{position:absolute;z-index:2;top:14vh;left:7vw;width:clamp(340px,28vw,455px);display:grid;gap:15px;padding:24px;border:1px solid rgba(255,255,255,.84);border-radius:32px;background:rgba(255,255,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.form-heading{display:grid;gap:4px;margin-bottom:2px}.form-heading h1{margin:0;color:var(--navy);font-size:clamp(28px,3.4vw,38px);line-height:1.18}.form-heading p{margin:0;color:var(--muted);font-size:14px;font-weight:900}.field{display:grid;gap:7px}.field label{color:var(--navy);font-size:13px;font-weight:900}.field input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;outline:0;color:var(--ink);background:#fbfdff;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);transition:border-color .15s ease,box-shadow .15s ease}.field input:focus{border-color:rgba(7,147,154,.55);box-shadow:0 0 0 4px rgba(7,147,154,.13)}.submit-btn{min-height:52px;border:0;border-radius:16px;color:white;background:linear-gradient(135deg,var(--navy),var(--teal));box-shadow:0 18px 38px rgba(5,36,63,.20);font-weight:900;cursor:pointer}.safe-link{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(215,170,75,.42);border-radius:16px;color:var(--navy);background:linear-gradient(135deg,rgba(215,170,75,.18),rgba(255,255,255,.66));font-size:13px;font-weight:900}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:641px) and (max-width:1100px){.login-page{background-image:url("{% static 'hesba/brand/login_tablet.png' %}");background-position:center}.language-field{top:max(24px,env(safe-area-inset-top));right:30px}.login-card{top:15vh;left:7vw;width:min(39vw,430px);min-width:330px;background:rgba(255,255,255,.58);box-shadow:0 16px 36px rgba(5,36,63,.10)}}@media(max-width:640px){.login-page{background-image:url("{% static 'hesba/brand/login_mobile.final.png' %}");background-position:center}.login-page:before{background:linear-gradient(180deg,rgba(251,246,236,.02),rgba(251,246,236,.24) 35%,rgba(251,246,236,.08))}.language-field{top:max(16px,env(safe-area-inset-top));right:auto;left:18px;min-height:40px;padding:7px 11px}.language-field select{min-width:96px}.login-card{top:30vh;left:50%;transform:translateX(-50%);width:min(86vw,352px);gap:12px;padding:18px;border-radius:26px;background:rgba(255,255,255,.68)}.form-heading h1{font-size:24px}.form-heading p,.field label,.safe-link{font-size:12px}.field input,.submit-btn{min-height:46px}}@media(max-height:700px) and (max-width:640px){.login-card{top:24vh}}
</style>
</head>
<body>
<main class="login-page" aria-label="Hesba login">
<div class="language-field"><label for="language">اللغة</label><select id="language" name="language" aria-label="Language selector">{% for language in language_options %}<option value="{{ language.code }}">{{ language.label }}</option>{% endfor %}</select></div>
<form class="login-card" action="{{ dashboard_url }}" method="get">
<div class="form-heading"><h1>تسجيل الدخول</h1><p>ادخل إلى لوحة حِسْبَة الآمنة.</p></div>
<div class="field"><label for="username">اسم المستخدم</label><input id="username" name="username" type="text" autocomplete="username" inputmode="text" placeholder="مثال: admin"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
<button class="submit-btn" type="submit">دخول إلى Dashboard</button>
<a class="safe-link" href="{{ home_url }}">فتح الخريطة الآمنة</a>
<span class="sr-only"><a href="{{ reports_url }}">Reports</a><a href="{{ status_url }}">Status</a></span>
</form>
</main>
</body>
</html>
