{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fcfd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hesba">
    <link rel="manifest" href="{% static 'hesba/manifest.json' %}">
    <link rel="preload" as="image" href="{% static 'hesba/brand/login_web.final.png' %}" media="(min-width: 1101px)">
    <link rel="preload" as="image" href="{% static 'hesba/brand/login_tablet.png' %}" media="(min-width: 641px) and (max-width: 1100px)">
    <link rel="preload" as="image" href="{% static 'hesba/brand/login_mobile.final.png' %}" media="(max-width: 640px)">
    <title>حِسْبَة - تسجيل الدخول</title>

    <style>
        :root {
            --navy: #062b53;
            --teal: #03b7bd;
            --teal-dark: #008996;
            --ink: #082a50;
            --muted: #5b6b7f;
            --paper: rgba(255, 255, 255, .48);
            --paper-strong: rgba(255, 255, 255, .70);
            --line: rgba(0, 145, 158, .22);
            --shadow: 0 24px 60px rgba(13, 82, 104, .16);
        }

        * { box-sizing: border-box; }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--ink);
            background: #f8fcfd;
        }

        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .login-page {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            background-image: url("{% static 'hesba/brand/login_web.final.png' %}");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        .language-field {
            position: absolute;
            top: max(22px, env(safe-area-inset-top));
            right: max(28px, env(safe-area-inset-right));
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            padding: 6px 12px;
            border: 1px solid rgba(0, 151, 164, .24);
            border-radius: 999px;
            background: rgba(255, 255, 255, .62);
            box-shadow: 0 10px 26px rgba(6, 43, 83, .10);
            backdrop-filter: blur(12px);
        }

        .language-field label {
            color: var(--navy);
            font-size: 12px;
            font-weight: 900;
        }

        .language-field select {
            min-width: 108px;
            border: 0;
            outline: 0;
            color: var(--navy);
            background: transparent;
            font-weight: 900;
        }

        .login-card {
            position: absolute;
            z-index: 2;
            top: 15vh;
            left: 8vw;
            width: clamp(330px, 27vw, 450px);
            display: grid;
            gap: 16px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, .82);
            border-radius: 30px;
            background: linear-gradient(180deg, var(--paper-strong), var(--paper));
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .form-heading {
            display: grid;
            gap: 5px;
            margin-bottom: 2px;
        }

        .form-heading h1 {
            margin: 0;
            color: var(--navy);
            font-size: 30px;
            line-height: 1.22;
        }

        .form-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 800;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        .field label {
            color: var(--navy);
            font-size: 13px;
            font-weight: 900;
        }

        .field input {
            width: 100%;
            min-height: 50px;
            border: 1px solid rgba(6, 43, 83, .12);
            border-radius: 16px;
            padding: 12px 14px;
            outline: 0;
            color: var(--ink);
            background: rgba(255, 255, 255, .88);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.88);
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .field input:focus {
            border-color: rgba(3, 183, 189, .56);
            box-shadow: 0 0 0 4px rgba(3, 183, 189, .14);
        }

        .submit-btn {
            min-height: 52px;
            border: 0;
            border-radius: 17px;
            color: #fff;
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            box-shadow: 0 16px 28px rgba(0, 137, 150, .22);
            font-weight: 900;
            cursor: pointer;
        }

        .safe-link {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 15px;
            color: var(--navy);
            background: rgba(255,255,255,.56);
            font-size: 13px;
            font-weight: 900;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (min-width: 641px) and (max-width: 1100px) {
            .login-page {
                background-image: url("{% static 'hesba/brand/login_tablet.png' %}");
                background-position: center center;
            }

            .language-field {
                top: max(24px, env(safe-area-inset-top));
                right: 30px;
            }

            .login-card {
                top: 16vh;
                left: 8vw;
                width: min(39vw, 430px);
                min-width: 330px;
                background: rgba(255, 255, 255, .34);
                box-shadow: none;
            }
        }

        @media (max-width: 640px) {
            .login-page {
                background-image: url("{% static 'hesba/brand/login_mobile.final.png' %}");
                background-position: center center;
            }

            .language-field {
                top: max(16px, env(safe-area-inset-top));
                right: auto;
                left: 18px;
                min-height: 40px;
                padding-inline: 11px;
            }

            .login-card {
                top: 30vh;
                left: 50%;
                transform: translateX(-50%);
                width: min(86vw, 352px);
                gap: 12px;
                padding: 18px;
                border-radius: 24px;
                background: rgba(255, 255, 255, .50);
            }

            .form-heading h1 {
                font-size: 24px;
            }

            .form-heading p,
            .field label,
            .safe-link {
                font-size: 12px;
            }

            .field input,
            .submit-btn {
                min-height: 46px;
            }
        }

        @media (max-height: 700px) and (max-width: 640px) {
            .login-card {
                top: 24vh;
            }
        }
    </style>
</head>
<body>
    <main class="login-page" aria-label="Hesba login">
        <div class="language-field">
            <label for="language">اللغة</label>
            <select id="language" name="language" aria-label="Language selector">
                {% for language in language_options %}
                    <option value="{{ language.code }}">{{ language.label }}</option>
                {% endfor %}
            </select>
        </div>

        <form class="login-card" action="{{ dashboard_url }}" method="get">
            <div class="form-heading">
                <h1>تسجيل الدخول</h1>
                <p>ادخل إلى لوحة حِسْبَة الآمنة.</p>
            </div>

            <div class="field">
                <label for="username">اسم المستخدم</label>
                <input id="username" type="text" autocomplete="username" inputmode="text" placeholder="مثال: admin">
            </div>

            <div class="field">
                <label for="password">كلمة المرور</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
            </div>

            <button class="submit-btn" type="submit">دخول إلى Dashboard</button>
            <a class="safe-link" href="{{ home_url }}">فتح الخريطة الآمنة</a>

            <span class="sr-only">
                <a href="{{ reports_url }}">Reports</a>
                <a href="{{ status_url }}">Status</a>
            </span>
        </form>
    </main>
</body>
</html>
