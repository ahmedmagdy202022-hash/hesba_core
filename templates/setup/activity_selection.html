{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختيار النشاط العام - حِسْبَة</title>
<link rel="stylesheet" href="{% static 'hesba/css/activity_selection.css' %}?v=117a-screen-pack">
<link rel="stylesheet" href="{% static 'hesba/css/activity_selection_final_overrides.css' %}?v=117a-final-panel-back-arrow">
</head>
<body class="activity-selection-page" data-lang="ar">
<main class="activity-stage" aria-label="General Activity Selection">
  <div class="activity-bg-frame" aria-hidden="true"></div>
  <section class="activity-ui-layer">
    <header class="activity-header" aria-label="Setup activity header">
      <div class="activity-brand"><img class="activity-logo" src="{% static 'hesba/setup_gate/assets/setup_gate_logo_approved.png' %}" alt="Hesba"></div>
      <div class="activity-controls" aria-label="Header controls">
        <form class="activity-control-form" method="post" action="{% url 'logout' %}">{% csrf_token %}
          <button class="activity-control activity-logout" type="submit" aria-label="تسجيل الخروج" data-logout-button>
            <svg viewBox="0 0 24 24" class="activity-icon" aria-hidden="true"><path d="M9 5H5v14h4M13 8l4 4-4 4M17 12H8"></path></svg><span class="activity-logout__text" data-i18n="logout">تسجيل الخروج</span>
          </button>
        </form>
        <button class="activity-control activity-language" type="button" data-lang-toggle aria-label="تغيير اللغة">
          <svg viewBox="0 0 24 24" class="activity-icon" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.35 2.45 3.55 5.45 3.55 9S14.35 18.55 12 21M12 3C9.65 5.45 8.45 8.45 8.45 12S9.65 18.55 12 21"></path></svg>
          <span data-i18n="language">العربية</span>
          <svg viewBox="0 0 24 24" class="activity-icon activity-caret" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
        </button>
      </div>
    </header>
    <section class="activity-panel" aria-labelledby="activity-title">
      <nav class="activity-stepper" aria-label="Setup steps">
        <div class="activity-step is-current"><span class="activity-step__number">1</span><span data-i18n="stepGeneral">النشاط العام</span></div>
        <div class="activity-step"><span class="activity-step__number">2</span><span data-i18n="stepSub">النشاط الفرعي</span></div>
        <div class="activity-step"><span class="activity-step__number">3</span><span data-i18n="stepModules">الموديولات</span></div>
        <div class="activity-step"><span class="activity-step__number">4</span><span data-i18n="stepReview">المراجعة</span></div>
      </nav>
      <div class="activity-copy">
        <h1 class="activity-title" id="activity-title" data-i18n="title">اختر النشاط العام</h1>
        <p class="activity-subtitle" data-i18n="subtitle">ابدأ بتحديد نوع نشاطك العام، ثم سنعرض الأنشطة الفرعية المناسبة لك.</p>
      </div>
      <div class="activity-grid" role="list" aria-label="General activities">
        <button class="activity-card is-active" type="button" role="listitem" data-activity="commercial" data-next="/setup/activity/commercial/" aria-pressed="false"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_commercial_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="commercial">تجاري</span></button>
        <button class="activity-card is-active" type="button" role="listitem" data-activity="services" data-next="/setup/activity/services/" aria-pressed="false"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_service_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="services">خدمي</span></button>
        <button class="activity-card is-disabled" type="button" role="listitem" data-activity="manufacturing" disabled aria-disabled="true"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_manufacturing_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="manufacturing">تصنيعي</span><span class="activity-card__soon" data-i18n="soon">قريبًا</span></button>
        <button class="activity-card is-disabled" type="button" role="listitem" data-activity="contracting" disabled aria-disabled="true"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_contracting_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="contracting">مقاولات</span><span class="activity-card__soon" data-i18n="soon">قريبًا</span></button>
        <button class="activity-card is-disabled" type="button" role="listitem" data-activity="restaurants" disabled aria-disabled="true"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_restaurant_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="restaurants">مطاعم</span><span class="activity-card__soon" data-i18n="soon">قريبًا</span></button>
        <button class="activity-card is-disabled" type="button" role="listitem" data-activity="medical" disabled aria-disabled="true"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_medical_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="medical">طبي</span><span class="activity-card__soon" data-i18n="soon">قريبًا</span></button>
        <button class="activity-card is-disabled" type="button" role="listitem" data-activity="education" disabled aria-disabled="true"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_education_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="education">تعليمي</span><span class="activity-card__soon" data-i18n="soon">قريبًا</span></button>
        <button class="activity-card is-disabled" type="button" role="listitem" data-activity="other" disabled aria-disabled="true"><img class="activity-card__icon" src="{% static 'hesba/setup_gate/icons/activity_other_icon.png' %}" alt="" aria-hidden="true"><span class="activity-card__title" data-i18n="other">أخرى</span><span class="activity-card__soon" data-i18n="soon">قريبًا</span></button>
      </div>
      <footer class="activity-footer" aria-label="Activity navigation">
        <button class="activity-action activity-next" type="button" disabled data-next-button><span data-i18n="next">التالي: اختيار النشاط الفرعي</span><span class="activity-action__circle" aria-hidden="true">←</span></button>
        <a class="activity-action activity-back" href="/setup/?lang=ar" data-back-link><span data-i18n="back">الرجوع</span><span class="activity-action__plain" aria-hidden="true">‹</span></a>
      </footer>
    </section>
  </section>
</main>
<script>
(function(){
  var params=new URLSearchParams(window.location.search);var saved=localStorage.getItem('hesba_lang');var lang=params.get('lang')==='en'?'en':(params.get('lang')==='ar'?'ar':(saved==='en'?'en':'ar'));var selectedRoute='';
  var dict={ar:{pageTitle:'اختيار النشاط العام - حِسْبَة',logout:'تسجيل الخروج',language:'العربية',stepGeneral:'النشاط العام',stepSub:'النشاط الفرعي',stepModules:'الموديولات',stepReview:'المراجعة',title:'اختر النشاط العام',subtitle:'ابدأ بتحديد نوع نشاطك العام، ثم سنعرض الأنشطة الفرعية المناسبة لك.',commercial:'تجاري',services:'خدمي',manufacturing:'تصنيعي',contracting:'مقاولات',restaurants:'مطاعم',medical:'طبي',education:'تعليمي',other:'أخرى',soon:'قريبًا',next:'التالي: اختيار النشاط الفرعي',back:'الرجوع',changeLanguage:'تغيير اللغة'},en:{pageTitle:'Choose general activity - Hesba',logout:'Logout',language:'English',stepGeneral:'General activity',stepSub:'Sub activity',stepModules:'Modules',stepReview:'Review',title:'Choose general activity',subtitle:'Start by choosing your general activity type, then we will show the suitable sub-activities.',commercial:'Commercial',services:'Services',manufacturing:'Manufacturing',contracting:'Contracting',restaurants:'Restaurants',medical:'Medical',education:'Education',other:'Other',soon:'Soon',next:'Next: choose sub-activity',back:'Back',changeLanguage:'Change language'}};
  function withLang(path){var url=new URL(path,window.location.origin);url.searchParams.set('lang',lang);return url.pathname+url.search;}
  function refreshLinks(){var back=document.querySelector('[data-back-link]');var next=document.querySelector('[data-next-button]');if(back)back.href=withLang('/setup/');if(next&&selectedRoute)next.dataset.href=withLang(selectedRoute);}
  function applyLanguage(nextLang){lang=nextLang==='en'?'en':'ar';localStorage.setItem('hesba_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dataset.lang=lang;document.title=dict[lang].pageTitle;document.querySelectorAll('[data-i18n]').forEach(function(el){var key=el.dataset.i18n;if(dict[lang][key])el.textContent=dict[lang][key];});document.querySelectorAll('[data-lang-toggle]').forEach(function(btn){btn.setAttribute('aria-label',dict[lang].changeLanguage);});document.querySelectorAll('[data-logout-button]').forEach(function(btn){btn.setAttribute('aria-label',dict[lang].logout);});var url=new URL(window.location.href);url.searchParams.set('lang',lang);window.history.replaceState({},'',url.pathname+url.search+url.hash);refreshLinks();}
  function clearSelection(){document.querySelectorAll('.activity-card.is-active').forEach(function(card){card.classList.remove('is-selected');card.setAttribute('aria-pressed','false');});}
  document.querySelectorAll('.activity-card.is-active').forEach(function(card){card.addEventListener('click',function(){clearSelection();card.classList.add('is-selected');card.setAttribute('aria-pressed','true');selectedRoute=card.dataset.next||'';var next=document.querySelector('[data-next-button]');if(next){next.disabled=false;next.dataset.href=withLang(selectedRoute);}});});
  document.querySelectorAll('.activity-card.is-disabled').forEach(function(card){card.addEventListener('click',function(event){event.preventDefault();});});
  var nextButton=document.querySelector('[data-next-button]');if(nextButton){nextButton.addEventListener('click',function(){if(nextButton.disabled||!selectedRoute)return;window.location.href=nextButton.dataset.href||withLang(selectedRoute);});}
  document.querySelectorAll('[data-lang-toggle]').forEach(function(btn){btn.addEventListener('click',function(){applyLanguage(lang==='ar'?'en':'ar');});});applyLanguage(lang);
})();
</script>
</body>
</html>
