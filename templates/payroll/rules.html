{% extends "operations/base.html" %}
{% load l10n %}
{% block operation_content %}
<section class="op-title-row"><div><a class="op-back" href="{% url 'payroll:list' %}?lang={{ lang }}">← {{ words.back }}</a><h1>{{ words.rules }}</h1><p>{{ words.review }}</p></div></section>
<form class="op-form" method="post" data-payroll-rules-form>{% csrf_token %}<input type="hidden" name="lang" value="{{ lang }}"><div class="op-form-grid">
<div class="op-field"><label for="r-emp">{{ words.emp_pct }}</label><input id="r-emp" name="employee_insurance_percent" inputmode="decimal" dir="ltr" value="{{ rules.employee_insurance_percent|unlocalize }}"{% if not can_manage %} disabled{% endif %}></div>
<div class="op-field"><label for="r-co">{{ words.co_pct }}</label><input id="r-co" name="company_insurance_percent" inputmode="decimal" dir="ltr" value="{{ rules.company_insurance_percent|unlocalize }}"{% if not can_manage %} disabled{% endif %}></div>
<div class="op-field"><label for="r-min">{{ words.min_wage }}</label><input id="r-min" name="insurance_min_wage" inputmode="decimal" dir="ltr" value="{{ rules.insurance_min_wage|unlocalize }}"{% if not can_manage %} disabled{% endif %}></div>
<div class="op-field"><label for="r-max">{{ words.max_wage }}</label><input id="r-max" name="insurance_max_wage" inputmode="decimal" dir="ltr" value="{{ rules.insurance_max_wage|unlocalize }}"{% if not can_manage %} disabled{% endif %}></div>
<div class="op-field"><label for="r-ex">{{ words.exemption }}</label><input id="r-ex" name="yearly_exemption" inputmode="decimal" dir="ltr" value="{{ rules.yearly_exemption|unlocalize }}"{% if not can_manage %} disabled{% endif %}></div>
<div class="op-field"><label for="r-br">{{ words.brackets }}</label><textarea id="r-br" name="tax_brackets" rows="8" dir="ltr"{% if not can_manage %} disabled{% endif %}>{{ rules.tax_brackets }}</textarea></div>
</div>{% if can_manage %}<div class="op-form-actions"><button class="op-primary" type="submit">{{ words.save }}</button></div>{% endif %}</form>
{% endblock %}
