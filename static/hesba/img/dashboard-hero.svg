<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-hidden="true">
  <!-- DEMO-FEEDBACK: dashboard welcome art. Hesba palette only (navy #05243F,
       teal #16BDC4, gold #D9AD50, off-white #F6FBFB). Decorative; no figures. -->
  <style>
    .float{animation:float 5s ease-in-out infinite}
    .float2{animation:float 6s ease-in-out infinite -2.5s}
    .float3{animation:float 4.5s ease-in-out infinite -1s}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
    .b2{animation-delay:.08s}.b3{animation-delay:.16s}.b4{animation-delay:.24s}.b5{animation-delay:.32s}.b6{animation-delay:.4s}.b7{animation-delay:.48s}
    .trend{stroke-dasharray:200;animation:draw 1.6s ease-out both .5s}
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
    .s2{animation-delay:-1s}.s3{animation-delay:-2s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes draw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
    @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16BDC4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#16BDC4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3A63"/><stop offset="1" stop-color="#082C4D"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16BDC4"/><stop offset="1" stop-color="#0E8F96"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2D58E"/><stop offset="1" stop-color="#D9AD50"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16BDC4"/><stop offset="1" stop-color="#0B8C93"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <circle cx="250" cy="150" r="150" fill="url(#glow)"/>
  <circle cx="250" cy="150" r="118" fill="none" stroke="#F6FBFB" stroke-opacity=".08" stroke-width="1.5"/>
  <circle cx="250" cy="150" r="146" fill="none" stroke="#F6FBFB" stroke-opacity=".05" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="128" y="46" width="248" height="160" rx="14" fill="url(#device)" stroke="#F6FBFB" stroke-opacity=".18"/>
    <rect x="139" y="57" width="226" height="138" rx="7" fill="#F6FBFB"/>
    <!-- screen: sidebar + top bar -->
    <rect x="139" y="57" width="30" height="138" rx="7" fill="#05243F"/>
    <rect x="160" y="57" width="9" height="138" fill="#05243F"/>
    <rect x="146" y="66" width="16" height="16" rx="4" fill="#16BDC4"/>
    <rect x="148" y="92" width="12" height="3" rx="1.5" fill="#F6FBFB" fill-opacity=".5"/>
    <rect x="148" y="102" width="12" height="3" rx="1.5" fill="#F6FBFB" fill-opacity=".35"/>
    <rect x="148" y="112" width="12" height="3" rx="1.5" fill="#F6FBFB" fill-opacity=".35"/>
    <rect x="148" y="122" width="12" height="3" rx="1.5" fill="#F6FBFB" fill-opacity=".35"/>
    <!-- KPI tiles -->
    <rect x="178" y="65" width="54" height="26" rx="5" fill="#FFFFFF" stroke="#DCE7EA"/>
    <rect x="184" y="71" width="20" height="3" rx="1.5" fill="#9DB0BD"/><rect x="184" y="79" width="34" height="6" rx="3" fill="#05243F"/>
    <rect x="238" y="65" width="54" height="26" rx="5" fill="#FFFFFF" stroke="#DCE7EA"/>
    <rect x="244" y="71" width="20" height="3" rx="1.5" fill="#9DB0BD"/><rect x="244" y="79" width="28" height="6" rx="3" fill="#0E8F96"/>
    <rect x="298" y="65" width="58" height="26" rx="5" fill="#FFF6E0" stroke="#F0DDAA"/>
    <rect x="304" y="71" width="20" height="3" rx="1.5" fill="#B99545"/><rect x="304" y="79" width="38" height="6" rx="3" fill="#D9AD50"/>
    <!-- chart card -->
    <rect x="178" y="98" width="122" height="88" rx="6" fill="#FFFFFF" stroke="#DCE7EA"/>
    <path d="M186 172H292" stroke="#DCE7EA"/>
    <rect class="bar" x="190" y="146" width="9" height="26" rx="2.5" fill="url(#barg)"/>
    <rect class="bar b2" x="204" y="136" width="9" height="36" rx="2.5" fill="url(#barg)"/>
    <rect class="bar b3" x="218" y="150" width="9" height="22" rx="2.5" fill="url(#barg)"/>
    <rect class="bar b4" x="232" y="128" width="9" height="44" rx="2.5" fill="url(#barg)"/>
    <rect class="bar b5" x="246" y="138" width="9" height="34" rx="2.5" fill="url(#barg)"/>
    <rect class="bar b6" x="260" y="118" width="9" height="54" rx="2.5" fill="url(#barg)"/>
    <rect class="bar b7" x="274" y="108" width="9" height="64" rx="2.5" fill="#05243F"/>
    <path class="trend" d="M194 140 L208 128 L222 138 L236 118 L250 126 L264 108 L278 98" fill="none" stroke="#D9AD50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="278" cy="98" r="3.5" fill="#D9AD50" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- donut card -->
    <rect x="306" y="98" width="50" height="88" rx="6" fill="#FFFFFF" stroke="#DCE7EA"/>
    <circle cx="331" cy="128" r="15" fill="none" stroke="#E6EEF0" stroke-width="7"/>
    <circle cx="331" cy="128" r="15" fill="none" stroke="#16BDC4" stroke-width="7" stroke-dasharray="58 94.2" transform="rotate(-90 331 128)"/>
    <circle cx="331" cy="128" r="15" fill="none" stroke="#D9AD50" stroke-width="7" stroke-dasharray="32 94.2" stroke-dashoffset="-60" transform="rotate(-90 331 128)"/>
    <rect x="315" y="156" width="32" height="3" rx="1.5" fill="#9DB0BD"/>
    <rect x="315" y="164" width="22" height="3" rx="1.5" fill="#C7D3DA"/>
    <rect x="315" y="172" width="27" height="3" rx="1.5" fill="#C7D3DA"/>
  </g>
  <!-- laptop base -->
  <path d="M106 206 H398 L388 220 Q386 224 380 224 H124 Q118 224 116 220 Z" fill="#0E3A63" stroke="#F6FBFB" stroke-opacity=".15"/>
  <rect x="226" y="206" width="52" height="5" rx="2.5" fill="#05243F"/>

  <!-- receipt -->
  <g class="float" filter="url(#shadow)">
    <g transform="rotate(-9 82 150)">
      <path d="M50 92 H114 V196 l-5.3 -5 -5.3 5 -5.3 -5 -5.3 5 -5.3 -5 -5.3 5 -5.3 -5 -5.3 5 -5.3 -5 -5.3 5 -5.3 -5 V92 Z" fill="#FFFFFF"/>
      <rect x="50" y="92" width="64" height="16" fill="#16BDC4"/>
      <rect x="58" y="98" width="26" height="4" rx="2" fill="#FFFFFF"/>
      <rect x="58" y="118" width="34" height="3.5" rx="1.75" fill="#C7D3DA"/><rect x="98" y="118" width="10" height="3.5" rx="1.75" fill="#9DB0BD"/>
      <rect x="58" y="128" width="28" height="3.5" rx="1.75" fill="#C7D3DA"/><rect x="98" y="128" width="10" height="3.5" rx="1.75" fill="#9DB0BD"/>
      <rect x="58" y="138" width="38" height="3.5" rx="1.75" fill="#C7D3DA"/><rect x="98" y="138" width="10" height="3.5" rx="1.75" fill="#9DB0BD"/>
      <path d="M58 150 H108" stroke="#C7D3DA" stroke-dasharray="2 2"/>
      <rect x="58" y="158" width="22" height="5" rx="2.5" fill="#05243F"/><rect x="88" y="158" width="20" height="5" rx="2.5" fill="#D9AD50"/>
      <g fill="#05243F"><rect x="60" y="172" width="1.5" height="10"/><rect x="63" y="172" width="3" height="10"/><rect x="68" y="172" width="1.5" height="10"/><rect x="71" y="172" width="1.5" height="10"/><rect x="74" y="172" width="3" height="10"/><rect x="79" y="172" width="1.5" height="10"/><rect x="82" y="172" width="4" height="10"/><rect x="88" y="172" width="1.5" height="10"/><rect x="91" y="172" width="3" height="10"/><rect x="96" y="172" width="1.5" height="10"/><rect x="99" y="172" width="1.5" height="10"/><rect x="102" y="172" width="3" height="10"/></g>
    </g>
  </g>

  <!-- growth chip -->
  <g class="float2" filter="url(#shadow)">
    <rect x="366" y="34" width="86" height="42" rx="12" fill="#FFFFFF"/>
    <circle cx="387" cy="55" r="11" fill="#E3F7EA"/>
    <path d="M382 59 L387 52 L392 59 M387 52 V62" fill="none" stroke="#1E8A4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="404" y="47" width="36" height="5" rx="2.5" fill="#05243F"/>
    <rect x="404" y="57" width="24" height="4" rx="2" fill="#9DB0BD"/>
  </g>

  <!-- shopping bag -->
  <g class="float3" filter="url(#shadow)">
    <path d="M384 128 a14 14 0 0 1 28 0" fill="none" stroke="#F2D58E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M374 128 H422 L428 176 Q428 182 422 182 H374 Q368 182 368 176 Z" fill="url(#bag)"/>
    <path d="M384 140 a14 14 0 0 0 28 0" fill="none" stroke="#F6FBFB" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- coins -->
  <g filter="url(#shadow)">
    <ellipse cx="432" cy="236" rx="24" ry="7" fill="#B98F35"/>
    <rect x="408" y="222" width="48" height="14" fill="#C9A045"/>
    <ellipse cx="432" cy="222" rx="24" ry="7" fill="url(#coin)"/>
    <rect x="408" y="208" width="48" height="14" fill="#C9A045"/>
    <ellipse cx="432" cy="208" rx="24" ry="7" fill="url(#coin)"/>
    <ellipse cx="432" cy="208" rx="15" ry="4" fill="none" stroke="#B98F35" stroke-width="1.5"/>
    <circle cx="384" cy="238" r="13" fill="url(#coin)"/>
    <circle cx="384" cy="238" r="8.5" fill="none" stroke="#B98F35" stroke-width="1.5"/>
  </g>

  <!-- sparkles -->
  <path class="spark" d="M96 52 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#F2D58E"/>
  <path class="spark s2" d="M352 236 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#16BDC4"/>
  <path class="spark s3" d="M454 112 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#F6FBFB"/>
  <circle cx="60" cy="236" r="3" fill="#16BDC4" opacity=".6"/>
  <circle cx="160" cy="262" r="2.5" fill="#D9AD50" opacity=".6"/>
</svg>
