name: Django Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  django-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test

  # DEPLOY-001: production runs on PostgreSQL (Supabase), and SQLite silently
  # ignores row locks (select_for_update), so the suite also runs on the real engine.
  django-tests-postgres:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://hesba:hesba-ci-only@localhost:5432/hesba

    steps:
      - name: Start PostgreSQL
        # The official postgres:16 image, tried from several registries in turn. Shared runners get
        # rate-limited on anonymous pulls: Docker Hub first, then AWS's public mirror ("toomanyrequests:
        # Data limit exceeded", Oct 2026). Google's mirror is tried first; a miss there falls back.
        run: |
          for image in mirror.gcr.io/library/postgres:16 docker.io/library/postgres:16 public.ecr.aws/docker/library/postgres:16; do
            if docker pull "$image"; then pulled="$image"; break; fi
          done
          test -n "$pulled" || { echo "::error::postgres:16 could not be pulled from any registry"; exit 1; }
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB=hesba -e POSTGRES_USER=hesba -e POSTGRES_PASSWORD=hesba-ci-only "$pulled"
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U hesba && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests on PostgreSQL
        run: python manage.py test --parallel 4 --noinput
